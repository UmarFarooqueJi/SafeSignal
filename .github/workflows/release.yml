name: SafeSignal Open-Source Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Signed Research APK & Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Static Analysis
        run: dart analyze lib test

      - name: Execute Complete Test Suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename Release Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/safesignal-${{ github.ref_name }}.apk

      - name: Compute Cryptographic SHA-256 Checksums
        run: |
          cd dist
          sha256sum safesignal-${{ github.ref_name }}.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          flutter pub deps --json > dist/sbom-dependencies.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SafeSignal Research Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/safesignal-${{ github.ref_name }}.apk
            dist/SHA256SUMS.txt
            dist/sbom-dependencies.json
          generate_release_notes: true
